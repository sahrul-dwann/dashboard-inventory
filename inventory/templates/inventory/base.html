<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{% block title %}Inventory System{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background-color: #f5f6fa;
        font-family: Arial, sans-serif;
      }

      /* Sidebar */
      .sidebar {
        width: 250px;
        min-height: 100vh;
        background-color: #17243a;
        padding: 25px 15px;
        position: fixed;
        top: 0;
        left: 0;
      }

      .sidebar h4 {
        color: #ffffff;
        font-weight: bold;
        margin-bottom: 35px;
        padding-left: 10px;
      }

      .sidebar-link {
        display: block;
        color: #cbd5e1;
        text-decoration: none;
        padding: 12px 15px;
        border-radius: 8px;
        margin-bottom: 8px;
        transition: 0.3s;
      }

      .sidebar-link:hover {
        background-color: #2d3d57;
        color: #ffffff;
      }

      .sidebar-link.active {
        background-color: #2563eb;
        color: #ffffff;
      }

      /* Main Content */
      .main-content {
        margin-left: 250px;
        padding: 30px;
      }

      /* Dashboard Card */
      .stat-card {
        border: none;
        border-radius: 12px;
        padding: 20px;
      }

      /* Responsive */
      @media (max-width: 768px) {
        .sidebar {
          position: relative;
          width: 100%;
          min-height: auto;
        }

        .main-content {
          margin-left: 0;
          padding: 20px;
        }
      }
    </style>
  </head>

  <body>
    <!-- Sidebar -->
    <div class="sidebar">
      <h4>Inventory System</h4>

      <nav>
        <a href="{% url 'dashboard' %}" class="sidebar-link"> Dashboard </a>

        <a href="#" class="sidebar-link"> Data Barang </a>

        <a href="{% url 'tambah_barang' %}" class="sidebar-link">
          Tambah Barang
        </a>
      </nav>
    </div>

    <main class="main-content">
      <!-- Notifikasi Django -->
      {% if messages %} {% for message in messages %}
      <div
        class="alert alert-{{ message.tags }} alert-dismissible fade show"
        role="alert"
      >
        {{ message }}

        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="alert"
          aria-label="Close"
        ></button>
      </div>
      {% endfor %} {% endif %} {% block content %} {% endblock %}
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
